[workspace]
resolver = "2"
members = ["modules/nvhttp", "modules/rtsp", "modules/control-transport", "modules/media-transport", "modules/upnp"]

[workspace.package]
license = "MIT"
edition = "2024"
rust-version = "1.89"
version = "0.1.0"

[workspace.dependencies]
amaterasu-contracts = { git = "https://github.com/nonary-streams/amaterasu-sdk.git", rev = "afeeab49f828ace1b6c9ed5a138701e1b8d3ba68" }
amaterasu-module-sdk = { git = "https://github.com/nonary-streams/amaterasu-sdk.git", rev = "afeeab49f828ace1b6c9ed5a138701e1b8d3ba68" }
amaterasu-media = { git = "https://github.com/nonary-streams/amaterasu-sdk.git", rev = "afeeab49f828ace1b6c9ed5a138701e1b8d3ba68" }
amaterasu-gamestream = { git = "https://github.com/nonary-streams/amaterasu-protocol.git", rev = "a5088b27d2632f9746b685223f6d7876702938ed" }
amaterasu-input-policy = { git = "https://github.com/nonary-streams/amaterasu-protocol.git", rev = "a5088b27d2632f9746b685223f6d7876702938ed" }
amaterasu-network-policy = { git = "https://github.com/nonary-streams/amaterasu-protocol.git", rev = "a5088b27d2632f9746b685223f6d7876702938ed" }
amaterasu-identity = { git = "https://github.com/nonary-streams/amaterasu-protocol.git", rev = "a5088b27d2632f9746b685223f6d7876702938ed" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
getrandom = "0.3"
httparse = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
